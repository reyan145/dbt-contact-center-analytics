name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          pip install dbt-core dbt-bigquery

      - name: Install dependencies
        run: dbt deps

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          dbt_contact_center:
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: ${{ secrets.DBT_BIGQUERY_PROJECT }}
                dataset: ${{ secrets.DBT_BIGQUERY_DATASET }}
                threads: 4
                keyfile: /tmp/keyfile.json
            target: dev
          EOF

      - name: Set up BigQuery service account key
        run: |
          echo '${{ secrets.DBT_BIGQUERY_KEYFILE_JSON }}' > /tmp/keyfile.json
        env:
          DBT_BIGQUERY_KEYFILE_JSON: ${{ secrets.DBT_BIGQUERY_KEYFILE_JSON }}

      - name: Run dbt tests
        run: dbt test