name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: Install dependencies
        run: dbt deps

      - name: Create dbt profiles.yml
        run: |
          cat > profiles.yml << EOF
          dbt_contact_center:
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: dbt-saas-analytics
                dataset: contact_center_data
                threads: 4
                keyfile: /tmp/keyfile.json
            target: dev
          EOF

      - name: Set up BigQuery service account key
        run: |
          echo '${{ secrets.DBT_BIGQUERY_KEYFILE_JSON }}' > /tmp/keyfile.json

      - name: Debug current directory
        run: |
          pwd
          ls -la
          cat profiles.yml || echo "profiles.yml not found"

      - name: Run dbt tests
        run: |
          unset DBT_PROFILES_DIR
          dbt test --profiles-dir ${{ github.workspace }}