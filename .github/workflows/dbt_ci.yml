name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt and BigQuery adapter
        run: |
          pip install --upgrade pip
          pip install dbt-core dbt-bigquery

      - name: Install dbt dependencies
        run: dbt deps

      - name: Set up BigQuery credentials
        run: |
          mkdir -p /tmp
          echo '${{ secrets.DBT_BIGQUERY_KEYFILE_JSON }}' > /tmp/keyfile.json

      - name: Run dbt tests
        run: |
          cat > profiles.yml << 'EOF'
          dbt_contact_center:
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: dbt-saas-analytics
                dataset: contact_center_data
                threads: 4
                keyfile: /tmp/keyfile.json
            target: dev
          EOF
          dbt test --profiles-dir .