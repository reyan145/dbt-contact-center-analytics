name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: Create dbt profiles directory
        run: mkdir -p ~/.dbt

      - name: Create dbt profiles.yml
        run: |
          cat > ~/.dbt/profiles.yml << 'EOF'
          dbt_contact_center:
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: dbt-saas-analytics
                dataset: contact_center_data
                threads: 4
                keyfile: /tmp/bq-key.json
            target: dev
          EOF

      - name: Setup BigQuery credentials
        run: |
          echo '${{ secrets.DBT_BIGQUERY_KEYFILE_JSON }}' > /tmp/bq-key.json

      - name: Install dependencies
        run: dbt deps

      - name: Run tests
        run: dbt test

# ci/cd test